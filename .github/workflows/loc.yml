name: loc

# Weekly + manual lines-of-code report across all 9aia repos.
# Thin caller — the tool and this org's config are distributed as
# tamias packs by the 9aia/cypera reusable workflow (pinned to
# cypera semver tag v0.2.2); the org config lives in packs/loc/.
#
# No docs publish — 9aia has no central metrics page; the run
# produces the summary artifact only. LOC_READ_TOKEN (optional PAT)
# widens repo counting to private repos; without it they are
# reported as skipped.

on:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC
  workflow_dispatch:

jobs:
  loc:
    uses: 9aia/cypera/.github/workflows/loc-org.yml@v0.2.2
    with:
      config_ref: git:9aia/.github//packs/loc#main
    secrets:
      LOC_READ_TOKEN: ${{ secrets.LOC_READ_TOKEN }}
